name: syntax

on:
  push:
    paths:
      - 'crates/reactive-syntax/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/syntax.yml'
  pull_request:
    paths:
      - 'crates/reactive-syntax/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/syntax.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -p reactive-syntax --check
      - name: Test
        run: cargo test -p reactive-syntax
      - name: Bench build
        run: cargo bench -p reactive-syntax --no-run
