name: syntax-fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/irrigation-syntax/fuzz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Parser fuzz smoke
        run: cargo fuzz run parser -- -runs=2000
      - name: Lexer fuzz smoke
        run: cargo fuzz run lexer -- -runs=2000
