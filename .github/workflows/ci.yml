name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # `missing_panics_doc` is allow-by-default. It is enabled here because a public
        # function that can abort without saying so is a contract gap the rest of -D
        # warnings cannot see; the workspace documents all of them as of the audit's
        # round 134.
        run: |
          cargo clippy --workspace --all-targets --all-features --locked \
            -- -D warnings -W clippy::missing_panics_doc

      - name: Test
        run: cargo test --workspace --locked

      # Observation is opt-in; the off state is a build contract, not a wish.
      - name: Observation off
        run: |
          cargo check -p irrigation-runtime --no-default-features --locked
          cargo test -p irrigation-runtime --no-default-features --locked
      # ... but the clippy job above runs with every feature on, so a field or
      # receiver that is dead only when `observe` is off is invisible to it. This
      # lints the off state with warnings denied, which is what caught the
      # `Delivery::moved` warning in the audit loop.
      - name: Observation off lints clean
        run: cargo clippy -p irrigation-runtime --no-default-features --all-targets --locked -- -D warnings

      # The facade must build without the observation path, and the examples
      # only with it.
      - name: Facade feature matrix
        run: |
          cargo check -p irrigation --all-targets --locked
          cargo build -p irrigation --examples --features observatory --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Markdown links
        run: python3 scripts/check-md-links.py
      # A doc link that resolves to nothing is a public page telling a reader to
      # look somewhere that does not exist -- including at types the crate never
      # had. `-D warnings` also holds back bare URLs and invalid html tags.
      - name: Rustdoc links
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/observatory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/observatory/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
