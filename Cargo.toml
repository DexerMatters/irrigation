[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Dexer Matters <dexermatters@gmail.com>"]
description = "A concurrent, fine-grained incremental computation system"

[workspace.dependencies]
reactive-core = { path = "crates/reactive-core" }
reactive-store = { path = "crates/reactive-store" }
reactive-plan = { path = "crates/reactive-plan" }
reactive-collections = { path = "crates/reactive-collections" }
reactive-runtime = { path = "crates/reactive-runtime" }
reactive-macros = { path = "crates/reactive-macros" }
reactive-test = { path = "crates/reactive-test" }
reactive = { path = "crates/reactive" }

syn = { version = "3.0.9", features = ["full", "extra-traits", "visit-mut", "printing", "proc-macro", "parsing"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
proptest = "1.12.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.9.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
