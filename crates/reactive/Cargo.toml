[package]
name = "reactive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
# The observation path: runtime events, the board's projection crate, and the
# syntax pipeline the example hosts display. Off by default; only the
# observatory examples require it.
observatory = ["dep:reactive-observe", "reactive-runtime/observe"]

[dependencies]
reactive-core.workspace = true
reactive-store.workspace = true
reactive-collections.workspace = true
reactive-runtime.workspace = true
reactive-macros.workspace = true
reactive-observe = { workspace = true, optional = true }

[dev-dependencies]
# A consumer of this facade, so it cannot also be an optional dependency here:
# a regular dependency on it would close a package cycle. Only the examples that
# are gated on `observatory` use it.
reactive-syntax.workspace = true
reactive-test.workspace = true

[[example]]
name = "observatory"
path = "examples/observatory/main.rs"
required-features = ["observatory"]

[[example]]
name = "observatory_json"
path = "examples/observatory_json.rs"
required-features = ["observatory"]

[[example]]
name = "observatory_min"
path = "examples/observatory_min.rs"
required-features = ["observatory"]

[[example]]
name = "observatory_syntax"
path = "examples/observatory_syntax.rs"
required-features = ["observatory"]

[[example]]
name = "observe_board"
path = "examples/observe_board.rs"
required-features = ["observatory"]

[[example]]
name = "observe_cost"
path = "examples/observe_cost.rs"
required-features = ["observatory"]
